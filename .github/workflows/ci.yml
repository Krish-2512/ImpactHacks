name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Backend checks ──────────────────────────────────────────────────────────
  backend:
    name: Backend — lint + import check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check imports compile (no syntax errors)
        run: python -c "import backend.main"
        env:
          MONGODB_URI: "mongodb://localhost:27017"
          SECRET_KEY: "ci-test-key-not-real-32bytehex0000"
          GROQ_API_KEY: "ci-placeholder"
          QDRANT_LOCAL_PATH: "/tmp/qdrant_ci"

  # ── Frontend checks ─────────────────────────────────────────────────────────
  frontend:
    name: Frontend — install + type check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (catches JSX errors + broken imports)
        run: npm run build
        env:
          VITE_API_URL: "https://placeholder.example.com"

  # ── Docker build check (mirrors what Render will build) ────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (same Dockerfile Render uses)
        run: docker build -t agrow-backend:ci .

  # ── Notify Render to deploy (triggers after Docker check passes) ────────────
  deploy-backend:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # Add RENDER_DEPLOY_HOOK_URL in GitHub repo → Settings → Secrets
        # Get the URL from Render dashboard → your service → Settings → Deploy Hook
